name: 功能请求
description: 新功能或体验改进建议
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前痛点是什么？谁会受益？
      placeholder: 作为…，我希望…，以便…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 若已有实现思路、API 草图或替代方案，请写上
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 主要影响组件
      multiple: true
      options:
        - bridge
        - hub
        - app
        - miniprogram
        - deploy
        - docs
        - other
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: checkboxes
    id: security
    attributes:
      label: 安全影响自检
      options:
        - label: 我已考虑该功能对 token / 沙箱 / 审批闸 / 中继信任边界的影响
          required: false
