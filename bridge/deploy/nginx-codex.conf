# Reverse proxy: wss://relay.example.com  ->  frp tunnel (127.0.0.1:8700) -> Mac bridge.
#
# Easiest path on this server (BaoTa): create a site for relay.example.com,
# apply a Let's Encrypt cert, then either (a) use 网站 > 反向代理 with target
# http://127.0.0.1:8700 and the WebSocket switch ON, or (b) paste the location{}
# block below into the site's 配置文件. This file is the raw equivalent for a
# hand-managed nginx.

# Rate-limit auth attempts per source IP (put in the http{} scope — BaoTa: 配置修改
# > 主配置). The bridge sees 127.0.0.1 behind frp, so per-IP limiting MUST live at
# nginx, which still has the real client address.
limit_req_zone  $binary_remote_addr zone=codexauth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=codexconn:10m;

server {
    listen 80;
    server_name relay.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name relay.example.com;

    # BaoTa writes these when you enable SSL; adjust if you manage nginx by hand.
    ssl_certificate     /www/server/panel/vhost/cert/relay.example.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/relay.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The ?token= lives in the query string — keep it out of the access log.
    # MANDATORY (not optional): without this the token is logged on every request.
    access_log off;

    location / {
        # Throttle brute force / connection floods (zones defined above).
        limit_req  zone=codexauth burst=10 nodelay;
        limit_conn codexconn 8;

        proxy_pass http://127.0.0.1:8700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Don't leak the token-bearing /file URL to upstreams via Referer.
        proxy_set_header Referer "";

        # Long-lived WebSocket + streaming media: disable buffering, raise timeouts.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
