server
{
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name relay.example.com;

    # Reuse the existing default (Cloudflare origin) cert, like chat.example.com.
    ssl_certificate    /www/server/panel/vhost/cert/0.default/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/0.default/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;

    # The pairing token rides in ?token= — keep it out of the access log.
    access_log off;
    error_log /www/wwwlogs/relay.example.com.error.log;

    location / {
        # frp tunnel endpoint to the Mac bridge (only exists while frpc is connected).
        proxy_pass http://127.0.0.1:8700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Referer "";

        # Long-lived WebSocket + streaming media.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
